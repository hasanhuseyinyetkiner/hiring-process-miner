name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hpm
          POSTGRES_PASSWORD: hpm
          POSTGRES_DB: hpm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hpm -d hpm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint and test
        env:
          DATABASE_URL: postgresql+psycopg://hpm:hpm@localhost:5432/hpm
          SEED_ON_STARTUP: "false"
          APP_ENV: test
        run: |
          uv python pin 3.12
          uv sync --frozen --group dev
          uv run ruff check src tests
          uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Lint, typecheck, test, and build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up --build -d
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8102/ready; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Stop
        if: always()
        run: docker compose down -v
