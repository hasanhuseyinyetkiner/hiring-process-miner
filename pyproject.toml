[project]
name = "hiring-process-miner"
version = "0.1.0"
description = "Open-source process mining for hiring funnels, bottlenecks, variants and conformance analysis."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pandas>=2.2",
    "numpy>=2.0",
    "python-multipart>=0.0.17",
    "psycopg[binary]>=3.2",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
pm4py = ["pm4py>=2.7.15"]

[project.scripts]
hpm = "hpm.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/hpm"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["src/hpm", "alembic", "alembic.ini", "README.md", "samples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "postgres: PostgreSQL-only behavior, executed in CI",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
# Closures are invoked before the next case is built; they do not escape the iteration.
"src/hpm/domain/seedgen.py" = ["B023"]
